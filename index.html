<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Booze Hound">
<meta name="theme-color" content="#0e1521">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Booze Hound</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column. The week's glasses lead; the day editor sits under them; money and history follow. */
:root {
  color-scheme: dark;
  --ink: #0e1521;        /* navy night, page */
  --panel: #172030;      /* navy-charcoal cards */
  --panel-2: #222c3d;    /* raised controls */
  --line: #2f3a4d;
  --text: #ede5d8;       /* warm paper */
  --muted: #a39b8c;
  --burgundy: #8a2c40;   /* accent: poured drinks, primary actions */
  --burgundy-hi: #b8455c;
  --brass: #c09a6b;      /* brown-gold: good news, money */
  --walnut: #5d4331;
  --over: #e0756a;       /* over the goal */
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "Hanken Grotesk", -apple-system, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
main {
  max-width: 480px;
  margin: 0 auto;
  padding: calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  display: flex;
  flex-direction: column;
  gap: 14px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }

/* Header */
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 44px; height: 44px; flex: none; }
h1 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; letter-spacing: .01em; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--panel); display: grid; place-items: center;
}
.icon-btn svg { width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0; }

/* Week hero */
.hero { background: linear-gradient(160deg, #1b2538 0%, #172030 55%, #231a22 100%); padding: 18px 16px 16px; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.week-nav { display: flex; gap: 6px; }
.week-nav button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 18px; line-height: 1; }
.week-nav button:disabled { opacity: .3; cursor: default; }
.tally { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 2px; }
.tally .num { font-size: 76px; line-height: 1; }
.tally span.of { color: var(--muted); font-size: 17px; }
.verdict { margin: 0 0 14px; font-weight: 600; color: var(--brass); }
.verdict.over { color: var(--over); }
.pips { display: flex; flex-wrap: wrap; gap: 7px; }
.pip {
  width: 23px; height: 30px;
  clip-path: polygon(0 0, 100% 0, 84% 100%, 16% 100%);
  background: var(--panel-2);
}
.pip.full { background: linear-gradient(to bottom, #2d3649 0 24%, var(--burgundy-hi) 24% 30%, var(--burgundy) 30%); }
.pip.extra { background: linear-gradient(to bottom, #3a2a30 0 24%, var(--over) 24%); }

/* Day strip */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 16px; }
.day {
  border: 1px solid transparent; background: rgba(255,255,255,.035); border-radius: 12px;
  padding: 7px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-height: 66px;
}
.day .dow { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .06em; }
.day .dom { font-size: 13px; color: var(--muted); }
.day .cnt { font-family: var(--display); font-size: 18px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.day .cnt.none { color: var(--line); }
.day.sel { border-color: var(--brass); background: rgba(192,154,107,.12); }
.day.today .dow { color: var(--brass); }
.day:disabled { opacity: .35; cursor: default; }

/* Day editor */
.editor h2 { font-family: var(--display); font-weight: 400; font-size: 20px; margin: 2px 0 14px; }
.row { display: flex; flex-direction: column; gap: 8px; }
.row + .row { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.row-head .hint { font-size: 13px; color: var(--muted); }
.stepper { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; align-items: stretch; }
.stepper button {
  height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel-2);
  font-size: 26px; line-height: 1;
}
.stepper button.plus { background: var(--burgundy); border-color: var(--burgundy-hi); }
.stepper.nic button.plus { background: var(--walnut); border-color: #7a5a44; }
.stepper button:active { transform: scale(.97); }
.stepper input {
  width: 100%; height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--ink);
  text-align: center; font-family: var(--display); font-size: 28px; font-variant-numeric: tabular-nums;
  -moz-appearance: textfield; appearance: textfield;
}
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stepper input::placeholder { color: var(--line); }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; font-size: 14px; font-weight: 500; color: var(--text);
}
.chip.on { border-color: var(--brass); color: var(--brass); }

/* Money */
.money-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
.stat .num { font-size: 34px; line-height: 1.1; display: block; }
.stat .num.good { color: var(--brass); }
.stat .num.bad { color: var(--over); }
.stat small { color: var(--muted); font-size: 13px; display: block; margin-top: 2px; }
.setup { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.setup label { font-size: 14px; }
.setup-row { display: flex; gap: 8px; }
.field {
  height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--ink);
  padding: 0 12px; width: 100%; min-width: 0;
}
.btn { height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--burgundy-hi); background: var(--burgundy); font-weight: 600; white-space: nowrap; }
.fine { font-size: 13px; color: var(--muted); margin: 10px 0 0; }

/* History */
.chart { position: relative; height: 150px; margin-top: 14px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; align-items: end; }
.goal-line { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--brass); opacity: .7; pointer-events: none; }
.goal-line span { position: absolute; right: 0; top: -17px; font-size: 11px; color: var(--brass); background: var(--panel); padding-left: 4px; }
.bar-col { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; min-width: 0; }
.bar-col .v { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text); }
.bar { width: 100%; border-radius: 6px 6px 2px 2px; background: var(--burgundy); min-height: 3px; }
.bar.over { background: var(--over); }
.bar.empty { background: var(--line); }
.bar-col.now .bar { outline: 1px solid var(--brass); outline-offset: 2px; }
.xlabels { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-top: 6px; }
.xlabels span { font-size: 11px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }

#status { font-size: 12px; color: var(--muted); text-align: center; margin: 4px 0 0; min-height: 17px; }

/* Settings */
dialog {
  border: 1px solid var(--line); border-radius: 20px; background: var(--panel); color: var(--text);
  width: min(440px, calc(100% - 24px)); padding: 20px; max-height: calc(100% - 24px);
}
dialog::backdrop { background: rgba(6,10,17,.7); }
dialog h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0 0 14px; }
.form { display: flex; flex-direction: column; gap: 14px; }
.form label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
.form label.check { flex-direction: row; align-items: center; gap: 10px; color: var(--text); font-size: 16px; min-height: 44px; }
.form input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--burgundy-hi); }
.form .btn { margin-top: 4px; }
.backup { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.backup .fine { margin: 0; }
.form label.filelabel { display: inline-flex; flex-direction: row; align-items: center; color: var(--text); cursor: pointer; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .stepper button:active { transform: none; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <svg viewBox="0 0 48 48" role="img" aria-label="Booze Hound logo: a hound's head in profile">
        <defs><clipPath id="badge"><circle cx="24" cy="24" r="24"/></clipPath></defs>
        <circle cx="24" cy="24" r="23.5" fill="#172030" stroke="#2f3a4d" stroke-width="1"/>
        <g clip-path="url(#badge)">
          <path d="M12.5 49C11 38 11.500 25 14 18c2-5.500 7-7.500 12-6.500 2.500.5 4 2 4.800 5 2.200 1 7.200 2 10.200 3.500 2 1 2.600 3 1.800 5-.5 1-.8 1.500-1.200 2 .2 2.500-1.100 5-4.100 5.300-2.500.2-4.500-1-6.500-1s-3.500 1.200-4.500 3.200c-1 2.500 0 8 3 14.500z" fill="#c09a6b"/>
          <path d="M16.500 15.500c3.500-2 8-.0 8.500 4.500.5 5-.5 10.500-2.500 14-1.500 2.500-4.500 2-5.500-1-1.500-4.500-2.500-12-.5-17.500z" fill="#9c7b52"/>
        </g>
      </svg>
      <h1>Booze Hound</h1>
    </div>
    <button class="icon-btn" id="open-settings" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </header>

  <section class="card hero" aria-labelledby="week-label">
    <div class="hero-top">
      <p class="label" id="week-label">This week</p>
      <div class="week-nav">
        <button type="button" id="prev-week" aria-label="Previous week">&#8249;</button>
        <button type="button" id="next-week" aria-label="Next week">&#8250;</button>
      </div>
    </div>
    <div class="tally"><span class="num" id="week-total">0</span><span class="of" id="week-of">of 10 drinks</span></div>
    <p class="verdict" id="verdict"></p>
    <div class="pips" id="pips" aria-hidden="true"></div>
    <div class="strip" id="strip"></div>
  </section>

  <section class="card editor" aria-labelledby="day-title">
    <p class="label">Log</p>
    <h2 id="day-title"></h2>
    <div class="row">
      <div class="row-head"><label class="label" for="drinks">Drinks</label><span class="hint" id="drinks-hint"></span></div>
      <div class="stepper">
        <button type="button" id="drinks-minus" aria-label="One fewer drink">&minus;</button>
        <input id="drinks" type="number" inputmode="numeric" min="0" max="99" placeholder="–" aria-label="Drinks this day">
        <button type="button" class="plus" id="drinks-plus" aria-label="Add a drink">+</button>
      </div>
      <div class="quick">
        <button type="button" class="chip" id="dry">No drinks this day</button>
        <button type="button" class="chip" id="clear-drinks">Clear</button>
      </div>
    </div>
    <div class="row" id="nic-row">
      <div class="row-head"><label class="label" for="nic">Nicotine</label><span class="hint" id="nic-hint"></span></div>
      <div class="stepper nic">
        <button type="button" id="nic-minus" aria-label="One fewer">&minus;</button>
        <input id="nic" type="number" inputmode="numeric" min="0" max="999" placeholder="–" aria-label="Nicotine this day">
        <button type="button" class="plus" id="nic-plus" aria-label="Add one">+</button>
      </div>
      <div class="quick">
        <button type="button" class="chip" id="nic-none">None this day</button>
        <button type="button" class="chip" id="clear-nic">Clear</button>
      </div>
    </div>
  </section>

  <section class="card" aria-labelledby="money-label">
    <p class="label" id="money-label">Money</p>
    <div class="money-grid">
      <div class="stat"><span class="num" id="saved">–</span><small id="saved-note">saved so far</small></div>
      <div class="stat"><span class="num" id="spent-week">$0</span><small id="spent-note">spent this week</small></div>
    </div>
    <div class="setup" id="baseline-setup">
      <label for="baseline-quick">To work out savings, how many drinks did you have in a usual week before you started?</label>
      <div class="setup-row">
        <input class="field" id="baseline-quick" type="number" inputmode="numeric" min="0" max="200" placeholder="e.g. 20">
        <button type="button" class="btn" id="baseline-set">Set</button>
      </div>
    </div>
    <p class="fine" id="money-fine"></p>
  </section>

  <section class="card" aria-labelledby="hist-label">
    <p class="label" id="hist-label">Last 8 weeks</p>
    <div class="chart" id="chart"></div>
    <div class="xlabels" id="xlabels"></div>
    <p class="fine" id="hist-fine"></p>
  </section>

  <p id="status" role="status"></p>
</main>

<dialog id="settings" aria-labelledby="settings-title">
  <h2 id="settings-title">Settings</h2>
  <div class="form">
    <label for="set-goal">Weekly drink goal
      <input class="field" id="set-goal" type="number" inputmode="numeric" min="0" max="40"></label>
    <label for="set-price">Cost per drink ($)
      <input class="field" id="set-price" type="number" inputmode="decimal" min="0" step="0.5"></label>
    <label for="set-baseline">Drinks in a usual week before you started
      <input class="field" id="set-baseline" type="number" inputmode="numeric" min="0" max="200" placeholder="Not set"></label>
    <label for="set-weekstart">Week starts on
      <select class="field" id="set-weekstart"><option value="1">Monday</option><option value="0">Sunday</option></select></label>
    <label class="check" for="set-nic"><input type="checkbox" id="set-nic"> Track nicotine</label>
    <label for="set-nicunit">Nicotine counted in
      <select class="field" id="set-nicunit">
        <option value="uses">uses</option><option value="cigarettes">cigarettes</option><option value="pouches">pouches</option>
        <option value="vape sessions">vape sessions</option><option value="pieces of gum">pieces of gum</option>
      </select></label>
    <div class="backup">
      <p class="label">Backup</p>
      <p class="fine">Your entries are stored only on this phone. Save a backup file now and then. Restoring replaces what is on this phone.</p>
      <div class="quick">
        <button type="button" class="chip" id="backup-export">Save backup</button>
        <label class="chip filelabel" for="backup-file">Restore from backup</label>
        <input id="backup-file" type="file" accept="application/json,.json" hidden>
      </div>
      <p class="fine" id="backup-msg" role="status"></p>
    </div>
    <button type="button" class="btn" id="close-settings">Done</button>
  </div>
</dialog>

<script>
(function () {
  'use strict';
  var LS = 'tenorless.v1';
  var DEFAULTS = { goal: 10, price: 12, baseline: null, nic: true, nicUnit: 'uses', weekStart: 1 };
  var state = { days: {}, settings: Object.assign({}, DEFAULTS) };
  var $ = function (id) { return document.getElementById(id); };

  // ---------- dates ----------
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var key = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var addDays = function (d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); };
  var today = function () { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  var parseKey = function (k) { var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  var weekStartOf = function (d) { return addDays(d, -((d.getDay() - state.settings.weekStart + 7) % 7)); };
  var fmt = function (d, o) { return d.toLocaleDateString('en-US', o); };
  var usd = function (n) {
    var whole = Math.abs(n % 1) < 0.005;
    var s = Math.abs(n).toLocaleString('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2 });
    return (n < 0 ? '−' : '') + s;
  };
  var plural = function (n, one, many) { return n + ' ' + (n === 1 ? one : many); };

  var sel = today();

  // ---------- local cache ----------
  function cache() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }
  function loadCache() {
    try {
      var raw = JSON.parse(localStorage.getItem(LS) || 'null');
      if (raw && typeof raw === 'object') adopt(raw);
    } catch (e) {}
  }
  function adopt(raw) {
    var days = {};
    var src = raw.days && typeof raw.days === 'object' ? raw.days : {};
    Object.keys(src).forEach(function (k) {
      var e = src[k]; if (!e || !/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      var o = {};
      if (typeof e.d === 'number' && e.d >= 0) o.d = Math.round(e.d);
      if (typeof e.n === 'number' && e.n >= 0) o.n = Math.round(e.n);
      if ('d' in o || 'n' in o) days[k] = o;
    });
    state = { days: days, settings: Object.assign({}, DEFAULTS, raw.settings || {}) };
  }

  // ---------- calculations ----------
  function entry(d) { return state.days[key(d)] || {}; }
  function weekSum(start, field) {
    var total = 0, logged = 0;
    for (var i = 0; i < 7; i++) { var v = entry(addDays(start, i))[field]; if (typeof v === 'number') { total += v; logged++; } }
    return { total: total, logged: logged };
  }
  function allTime() {
    var logged = 0, drinks = 0, first = null;
    Object.keys(state.days).forEach(function (k) {
      var e = state.days[k];
      if (typeof e.d === 'number') { logged++; drinks += e.d; if (!first || k < first) first = k; }
    });
    return { logged: logged, drinks: drinks, first: first };
  }
  function goalStreak() {
    var w = addDays(weekStartOf(today()), -7), n = 0;
    for (var i = 0; i < 520; i++) {
      var s = weekSum(w, 'd');
      if (!s.logged || s.total > state.settings.goal) break;
      n++; w = addDays(w, -7);
    }
    return n;
  }

  // ---------- render ----------
  function render() {
    var S = state.settings, t = today();
    var ws = weekStartOf(sel), thisWs = weekStartOf(t), isNow = +ws === +thisWs;
    var wk = weekSum(ws, 'd');

    $('week-label').textContent = isNow ? 'This week' : fmt(ws, { month: 'short', day: 'numeric' }) + ' – ' + fmt(addDays(ws, 6), { month: 'short', day: 'numeric' });
    $('next-week').disabled = isNow;
    $('week-total').textContent = wk.total;
    $('week-of').textContent = 'of ' + S.goal + (S.goal === 1 ? ' drink' : ' drinks');

    var left = S.goal - wk.total, v = $('verdict');
    v.className = 'verdict' + (left < 0 ? ' over' : '');
    if (isNow) {
      v.textContent = left > 0 ? left + ' left through ' + fmt(addDays(ws, 6), { weekday: 'long' })
        : left === 0 ? 'At your limit for the week' : (-left) + ' over this week’s goal';
    } else {
      v.textContent = !wk.logged ? 'Nothing logged this week'
        : left > 0 ? 'Finished ' + left + ' under your goal' : left === 0 ? 'Finished right on your goal' : 'Finished ' + (-left) + ' over your goal';
    }

    var pips = '', count = Math.min(Math.max(S.goal, wk.total), 60);
    for (var i = 0; i < count; i++) pips += '<span class="pip' + (i >= S.goal ? ' extra' : i < wk.total ? ' full' : '') + '"></span>';
    $('pips').innerHTML = pips;

    var strip = '';
    for (var j = 0; j < 7; j++) {
      var d = addDays(ws, j), e = entry(d), has = typeof e.d === 'number';
      strip += '<button type="button" class="day' + (+d === +sel ? ' sel' : '') + (+d === +t ? ' today' : '') + '" data-k="' + key(d) + '"' + (d > t ? ' disabled' : '') +
        ' aria-label="' + fmt(d, { weekday: 'long', month: 'long', day: 'numeric' }) + (has ? ', ' + plural(e.d, 'drink', 'drinks') : ', not logged') + '"' + (+d === +sel ? ' aria-pressed="true"' : '') + '>' +
        '<span class="dow">' + fmt(d, { weekday: 'short' }).slice(0, 2).toUpperCase() + '</span>' +
        '<span class="dom">' + d.getDate() + '</span>' +
        '<span class="cnt' + (has ? '' : ' none') + '">' + (has ? e.d : '·') + '</span></button>';
    }
    $('strip').innerHTML = strip;

    // day editor
    var se = entry(sel);
    $('day-title').textContent = (+sel === +t ? 'Today, ' : '') + fmt(sel, { weekday: 'long', month: 'short', day: 'numeric' });
    setInput('drinks', se.d);
    setInput('nic', se.n);
    $('drinks-hint').textContent = typeof se.d === 'number' ? usd(se.d * S.price) + ' this day' : 'Not logged yet';
    $('dry').classList.toggle('on', se.d === 0);
    $('nic-row').hidden = !S.nic;
    if (S.nic) {
      var nw = weekSum(ws, 'n'), np = weekSum(addDays(ws, -7), 'n'), hint = nw.total + ' ' + S.nicUnit + ' this week';
      if (np.logged && nw.logged) {
        var diff = nw.total - np.total;
        hint += diff === 0 ? ', same as the week before' : ', ' + (diff < 0 ? 'down ' + (-diff) : 'up ' + diff) + ' on the week before';
      }
      $('nic-hint').textContent = hint;
      $('nic-none').classList.toggle('on', se.n === 0);
    }

    // money
    var a = allTime(), cw = weekSum(thisWs, 'd');
    $('spent-week').textContent = usd(cw.total * S.price);
    $('spent-note').textContent = 'spent this week at ' + usd(S.price) + ' a drink';
    var hasBase = typeof S.baseline === 'number';
    $('baseline-setup').hidden = hasBase;
    var sv = $('saved');
    if (hasBase && a.logged) {
      var saved = (S.baseline / 7 * a.logged - a.drinks) * S.price;
      saved = Math.round(saved);
      sv.textContent = usd(saved);
      sv.className = 'num ' + (saved >= 0 ? 'good' : 'bad');
      $('saved-note').textContent = saved >= 0 ? 'saved so far' : 'more than your usual spend';
      $('money-fine').textContent = 'Compared with your usual ' + S.baseline + ' a week, across ' + plural(a.logged, 'logged day', 'logged days') +
        ' since ' + fmt(parseKey(a.first), { month: 'short', day: 'numeric' }) + '. Days you skip logging are left out.';
    } else {
      sv.textContent = '–'; sv.className = 'num';
      $('saved-note').textContent = 'saved so far';
      $('money-fine').textContent = hasBase ? 'Log a day to start the savings count.' : '';
    }

    // history
    var weeks = [], max = S.goal;
    for (var w = 7; w >= 0; w--) { var st = addDays(thisWs, -7 * w), s = weekSum(st, 'd'); weeks.push({ st: st, s: s, now: w === 0 }); if (s.total > max) max = s.total; }
    max = Math.max(max * 1.18, 1);
    var bars = '<div class="goal-line" style="bottom:' + (S.goal / max * 100) + '%"><span>goal ' + S.goal + '</span></div>', xl = '', hit = 0, counted = 0;
    weeks.forEach(function (x) {
      var over = x.s.total > S.goal;
      if (x.s.logged) { counted++; if (!over) hit++; }
      bars += '<div class="bar-col' + (x.now ? ' now' : '') + '"><span class="v">' + (x.s.logged ? x.s.total : '') + '</span>' +
        '<div class="bar' + (!x.s.logged ? ' empty' : over ? ' over' : '') + '" style="height:' + (x.s.logged ? x.s.total / max * 100 : 0) + '%"></div></div>';
      xl += '<span>' + (x.st.getMonth() + 1) + '/' + x.st.getDate() + '</span>';
    });
    $('chart').innerHTML = bars;
    $('xlabels').innerHTML = xl;
    var streak = goalStreak();
    $('hist-fine').textContent = !counted ? 'Your weekly totals will build up here as you log.'
      : 'At or under goal in ' + hit + ' of ' + plural(counted, 'logged week', 'logged weeks') + '.' +
        (streak > 1 ? ' ' + streak + ' finished weeks in a row on goal.' : '');
  }
  function setInput(id, v) {
    var el = $(id);
    if (document.activeElement === el) return;
    el.value = typeof v === 'number' ? v : '';
  }

  // ---------- edits ----------
  function setValue(field, v) {
    var k = key(sel), e = Object.assign({}, state.days[k] || {});
    if (v === null || isNaN(v)) delete e[field];
    else e[field] = Math.max(0, Math.min(field === 'd' ? 99 : 999, Math.round(v)));
    if ('d' in e || 'n' in e) state.days[k] = e; else delete state.days[k];
    touched[k] = true;
    changed();
  }
  function bump(field, by) {
    var cur = entry(sel)[field];
    if (typeof cur !== 'number') { if (by < 0) return; cur = 0; }
    setValue(field, cur + by);
  }
  function setSetting(name, v) {
    state.settings = Object.assign({}, state.settings); state.settings[name] = v;
    settingsTouched = true;
    changed();
  }
  function wireField(field, id, minus, plus, zero, clear) {
    $(minus).onclick = function () { bump(field, -1); };
    $(plus).onclick = function () { bump(field, 1); };
    $(zero).onclick = function () { setValue(field, 0); };
    $(clear).onclick = function () { $(id).value = ''; setValue(field, null); };
    $(id).addEventListener('input', function () { var v = this.value.trim(); setValue(field, v === '' ? null : parseInt(v, 10)); });
    $(id).addEventListener('blur', render);
  }
  wireField('d', 'drinks', 'drinks-minus', 'drinks-plus', 'dry', 'clear-drinks');
  wireField('n', 'nic', 'nic-minus', 'nic-plus', 'nic-none', 'clear-nic');

  $('strip').addEventListener('click', function (ev) {
    var b = ev.target.closest('.day'); if (!b || b.disabled) return;
    sel = parseKey(b.dataset.k); render();
  });
  $('prev-week').onclick = function () { sel = addDays(sel, -7); render(); };
  $('next-week').onclick = function () { var n = addDays(sel, 7), t = today(); sel = n > t ? t : n; render(); };

  $('baseline-set').onclick = function () {
    var v = parseInt($('baseline-quick').value, 10);
    if (!isNaN(v) && v >= 0) setSetting('baseline', v);
  };

  // settings dialog
  var dlg = $('settings');
  $('open-settings').onclick = function () {
    var S = state.settings;
    $('set-goal').value = S.goal; $('set-price').value = S.price;
    $('set-baseline').value = typeof S.baseline === 'number' ? S.baseline : '';
    $('set-weekstart').value = String(S.weekStart); $('set-nic').checked = !!S.nic; $('set-nicunit').value = S.nicUnit;
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  };
  $('close-settings').onclick = function () { if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); };
  dlg.addEventListener('click', function (ev) { if (ev.target === dlg && dlg.close) dlg.close(); });
  $('set-goal').onchange = function () { var v = parseInt(this.value, 10); if (!isNaN(v) && v >= 0) setSetting('goal', Math.min(v, 40)); };
  $('set-price').onchange = function () { var v = parseFloat(this.value); if (!isNaN(v) && v >= 0) setSetting('price', v); };
  $('set-baseline').onchange = function () { var v = parseInt(this.value, 10); setSetting('baseline', isNaN(v) || v < 0 ? null : v); };
  $('set-weekstart').onchange = function () { setSetting('weekStart', Number(this.value)); };
  $('set-nic').onchange = function () { setSetting('nic', this.checked); };
  $('set-nicunit').onchange = function () { setSetting('nicUnit', this.value); };

  // ---------- backup ----------
  $('backup-export').onclick = async function () {
    var name = 'booze-hound-backup-' + key(today()) + '.json', text = JSON.stringify(state, null, 1);
    try {
      var f = new File([text], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
  };
  $('backup-file').onchange = function () {
    var f = this.files[0], msg = $('backup-msg'); if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var raw = JSON.parse(r.result);
        if (!raw || typeof raw.days !== 'object' || !raw.days) throw new Error('shape');
        adopt(raw); changed();
        msg.textContent = 'Backup restored.';
      } catch (e) { msg.textContent = 'That file isn\u2019t a Booze Hound backup.'; }
    };
    r.readAsText(f); this.value = '';
  };

  // ---------- saving ----------
  var ref = null, loaded = false, writing = false, dirty = false, retried = false, timer = null;
  var touched = {}, settingsTouched = false;
  function status(msg) { $('status').textContent = msg; }
  function changed() { cache(); render(); dirty = true; schedule(); }
  function schedule() { clearTimeout(timer); timer = setTimeout(flush, 700); }
  async function flush() {
    if (!ref || !loaded || writing || !dirty) return;
    writing = true; dirty = false;
    try {
      await ref.set(JSON.parse(JSON.stringify(state)));
      retried = false;
      if (!dirty) { touched = {}; settingsTouched = false; }
      status('Saved to your Claude account.');
    } catch (e) {
      dirty = true;
      if (e && e.code === 'unavailable' && !retried) { retried = true; writing = false; timer = setTimeout(flush, 1500 + Math.random() * 1500); return; }
      writing = false;
      status('Couldn’t save to your account just now. Your entries are kept on this device and will be sent with your next change.');
      return;
    }
    writing = false;
    if (dirty) schedule();
  }
  function onSnap(snap) {
    if (writing) return;
    var confirmed = !snap.metadata || !snap.metadata.fromCache;
    if (snap.exists) {
      var mine = state, remote = snap.data() || {};
      adopt(remote);
      Object.keys(touched).forEach(function (k) { if (mine.days[k]) state.days[k] = mine.days[k]; else delete state.days[k]; });
      if (settingsTouched) state.settings = mine.settings;
    } else if (confirmed && !loaded && Object.keys(state.days).length) {
      dirty = true; // first sync from this device
    }
    if (confirmed) { loaded = true; clearTimeout(slow); if ($('status').dataset.slow) { delete $('status').dataset.slow; status(''); } }
    cache(); render();
    if (dirty) schedule();
  }
  var slow = null;
  async function connect() {
    var local = 'Saved on this phone only.';
    if (!window.claude || !window.claude.use) { status(local); return; }
    var db = null, user = null, id = null;
    try {
      var got = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      db = got[0]; user = got[1]; id = user ? await user.id() : null;
    } catch (e) {}
    if (!db || !id) { status(local); return; }
    ref = db.doc('data/users/' + id + '/log');
    slow = setTimeout(function () {
      if (!loaded) { $('status').dataset.slow = '1'; status('Can’t reach your saved data yet. Showing what’s on this device.'); }
    }, 10000);
    ref.onSnapshot(onSnap, function () {
      clearTimeout(slow); ref = null;
      status('Lost the connection to your saved data. Entries stay on this device until you reopen the page.');
    });
  }

  loadCache();
  render();
  connect();
  // roll over to the new day if the page is left open overnight
  document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });
})();
</script>
</body>
</html>
